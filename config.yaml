data:
  root: data/chbmit
  siena_root: data/siena
  siena_allow_missing_channels: false
  output: artifacts
  sampling_rate: 256
  channels: 18
  window_seconds: 4
  overlap: 0.5
  low_hz: 0.5
  high_hz: 40.0
  notch_hz: 60.0
  preictal_horizons_minutes: [5, 10, 15, 30]
  onset_exclusion_seconds: 0
  interictal_exclusion_seconds: 0
  postictal_exclusion_seconds: 300
  buffer_sensitivity_seconds: [0, 60, 300]
  max_windows_per_recording_per_class: 128
training:
  seed: 17
  epochs: 12
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  adversarial_weight: 0.1
  workers: 0
  device: auto
  max_train_windows_per_class: 30000
  max_test_windows: 50000
  threshold: 0.5
model:
  width: 32
  dropout: 0.25
  domain_adversarial: true
