[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seizure-prediction"
version = "0.1.0"
description = "Patient-independent multi-domain EEG seizure prediction research prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "torch>=2.2",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "mne>=1.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
explain = ["shap>=0.45"]

[project.scripts]
seizure-prediction = "seizure_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
