<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1835" viewBox="0 0 1160 1835" role="img" aria-labelledby="title description">
  <title id="title">Logical architecture and evaluation of the patient-independent seizure prediction project</title>
  <desc id="description">A six-stage architecture showing CHB-MIT EEG preprocessing and SOP/SPH labeling, a shared multi-horizon model, patient-separated LOSO training, class-imbalance handling, validation-calibrated event alarms with a two-window persistence rule, full downloaded-cohort Siena external evaluation, matched baselines, and explanation stability and faithfulness audits.</desc>
