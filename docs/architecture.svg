  <text class="body" x="267" y="286">
    <tspan x="267">• Map canonical EEG channels</tspan>
    <tspan x="267" dy="23">• 60 Hz notch + band-pass</tspan>
    <tspan x="267" dy="23">• Resample to 128 Hz</tspan>
  </text>
  <rect class="card" x="540" y="230" width="250" height="130" fill="#fff5df"/>
  <text class="heading center" x="665" y="258">Windowing and labels</text>
  <text class="body" x="559" y="286">
    <tspan x="559">• 10 s windows · 50% overlap</tspan>
    <tspan x="559" dy="23">• SOP-specific labels · 5 min SPH</tspan>
    <tspan x="559" dy="23">• Exclude ictal / ambiguous windows</tspan>
  </text>
