  <text class="heading center" x="580" y="122">Multichannel EEG (CHB-MIT)</text>
  <text class="body center" x="580" y="146">EDF recordings + patient-specific seizure onset annotations</text>
  <text class="small center" x="580" y="163">16 CHB-MIT cases · 15 people · 5 / 10 / 15 / 30-minute SOPs · 5-minute SPH</text>
