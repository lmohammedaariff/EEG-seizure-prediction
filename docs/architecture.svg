  <rect x="977" y="1448" width="31" height="56" fill="#e9bd49"/>
  <rect x="1021" y="1478" width="31" height="26" fill="#659dd5"/>
  <text class="tiny center" x="948" y="1521">Temp.</text>
  <text class="tiny center" x="992" y="1521">Freq.</text>
  <text class="tiny center" x="1036" y="1521">T-F</text>
  <text class="tiny center" x="1003" y="1540">Stability + random-mask faithfulness audit</text>

  <rect x="20" y="1585" width="1120" height="230" rx="14" fill="#fff1e5" stroke="#dcaa78" stroke-width="1.5"/>
  <text class="heading" x="45" y="1618">6. CONTROLLED PATIENT-HELD-OUT EVALUATION</text>
  <text class="body" x="45" y="1647">Sixteen held-out case folds represent 15 people; a separate patient group is used for validation.</text>
  <text class="small" x="45" y="1668">Cases chb01 and chb21 are kept out of each other’s train/validation folds and combined for person-level summaries.</text>
  <text class="body" x="45" y="1692">Class handling: patient/state-balanced sampling plus class-weighted loss for each SOP head; label counts are audited.</text>
  <text class="body" x="45" y="1716">Ablations and matched CNN, LSTM, CNN–LSTM baselines use identical patient folds and horizon labels.</text>
  <text class="small" x="45" y="1741">Validation-only thresholds plus a two-consecutive-window alert-persistence rule target 0.1 / 0.5 / 1.0 false alarms per hour.</text>
  <text class="small" x="45" y="1763">Report event sensitivity, false alarms/hour and warning lead time separately from window-level metrics.</text>
  <text class="small" x="45" y="1785">Audit EEG explanations for cross-window channel stability and top-channel vs random-mask faithfulness.</text>
  <text class="small" x="45" y="1807">Full downloaded Siena cohort (14 participants) tested; CHB threshold transfer fails at strict sensitivity/FAR operating points.</text>
</svg>
